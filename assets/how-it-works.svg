<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How BeamDial routes a request">
  <style>
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .hl { fill: #eef3ff; stroke: #4f8cff; stroke-width: 2; }
    .ok { fill: #eafaf3; stroke: #2e9e6a; stroke-width: 1.5; }
    .t { font: 600 16px ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 13px ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif; fill: #57606a; }
    .m { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #4f8cff; }
    .a { stroke: #8c959f; stroke-width: 2; fill: none; marker-end: url(#h); }
    .r { stroke: #e07b39; stroke-width: 2; fill: none; marker-end: url(#hr); stroke-dasharray: 6 5; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; } .hl { fill: #12203d; } .ok { fill: #0f2a20; }
      .t { fill: #e6edf3; } .s { fill: #9ba5b0; } rect.bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
    <marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07b39"/></marker>
  </defs>
  <rect class="bg" width="1200" height="300" fill="#ffffff"/>

  <rect class="box" x="20" y="70" width="170" height="90" rx="12"/>
  <text class="t" x="105" y="108" text-anchor="middle">Your prompt</text>
  <text class="s" x="105" y="132" text-anchor="middle">messages=[...]</text>

  <rect class="hl" x="240" y="60" width="230" height="110" rx="12"/>
  <text class="t" x="355" y="96" text-anchor="middle">Router (local)</text>
  <text class="s" x="355" y="120" text-anchor="middle">P(correct) at each level</text>
  <text class="m" x="355" y="146" text-anchor="middle">cheapest ≥ target</text>

  <rect class="box" x="520" y="70" width="200" height="90" rx="12"/>
  <text class="t" x="620" y="106" text-anchor="middle">Beam</text>
  <text class="m" x="620" y="132" text-anchor="middle">reasoning_effort=…</text>

  <rect class="box" x="770" y="70" width="170" height="90" rx="12"/>
  <text class="t" x="855" y="106" text-anchor="middle">Your check</text>
  <text class="s" x="855" y="130" text-anchor="middle">tests · schema · regex</text>

  <rect class="ok" x="990" y="70" width="190" height="90" rx="12"/>
  <text class="t" x="1085" y="106" text-anchor="middle">Answer</text>
  <text class="s" x="1085" y="130" text-anchor="middle">+ level, tokens, cost</text>

  <path class="a" d="M190 115 H236"/>
  <path class="a" d="M470 115 H516"/>
  <path class="a" d="M720 115 H766"/>
  <path class="a" d="M940 115 H986"/>
  <text class="s" x="963" y="104" text-anchor="middle">pass</text>

  <path class="r" d="M855 160 V225 H620 V164"/>
  <text class="s" x="738" y="248" text-anchor="middle" style="fill:#e07b39">fail → next level  ·  cut off → same level, more room  ·  capped by max_attempts</text>
  <text class="s" x="355" y="200" text-anchor="middle">no network call, &lt;1 MB, pure Python</text>
</svg>
