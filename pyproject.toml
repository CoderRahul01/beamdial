[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamdial"
version = "0.1.0"
description = "Pick Beam's reasoning_effort per request. Pay for max thinking only when it helps."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Rahul Pandey"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["beam", "reflection", "llm", "reasoning", "reasoning-effort", "routing", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
beamdial = "beamdial.__main__:main"

[project.urls]
Homepage = "https://github.com/CoderRahul01/beamdial"
Demo = "https://huggingface.co/spaces/PengoSword123/beamdial"
Dataset = "https://huggingface.co/datasets/PengoSword123/beamdial-v0.1"
Issues = "https://github.com/CoderRahul01/beamdial/issues"

[tool.setuptools]
packages = ["beamdial"]

[tool.setuptools.package-data]
beamdial = ["router_weights.json", "py.typed"]
